# ---------------------------------------------------------------------------
# CNI Lava Stroke Engine NPE Fix - mod metadata
# https://github.com/chushi0/cni-lava-stroke-engine-npe-fix
#
# Client side only mod: it does not have to be installed on a server.
# ---------------------------------------------------------------------------
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/chushi0/cni-lava-stroke-engine-npe-fix/issues"

[[mods]]
    modId = "cni_lavastrokefix"
    version = "1.0.0"
    displayName = "CNI Lava Stroke Engine NPE Fix"
    authors = "deepseek-v4-flash, Cline"
    credits = "chushi0 (https://github.com/chushi0) - 问题复现、测试与发布"
    description = '''
    Client side fix for the crash of Create: Nether Industry's "Lava Stroke Engine"
    (createnetherindustry:lava_stroke_engine): the Flywheel PartialModel of the block is never
    baked, so LavaStrokeEngineRenderer#renderVectorMotionRod fails with
    NullPointerException: "model" is null.

    修复《机械动力：下界工业》的“熔岩冲程引擎”在客户端首次渲染时崩溃
    （NullPointerException: "model" is null）的问题。仅客户端安装，服务端无需安装。

    Tested with: Minecraft 1.21.1, NeoForge 21.1.244, Create 6.0.10, Flywheel 1.0.6,
    Create: Nether Industry 0.2.3.

    Source code, build instructions and the analysis of the root cause:
    https://github.com/chushi0/cni-lava-stroke-engine-npe-fix
    '''
    displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
    config = "cni_lavastrokefix.mixins.json"

[[dependencies.cni_lavastrokefix]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.200,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.cni_lavastrokefix]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1]"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.cni_lavastrokefix]]
    modId = "flywheel"
    type = "required"
    versionRange = "[1.0.0,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.cni_lavastrokefix]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.0,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.cni_lavastrokefix]]
    modId = "createnetherindustry"
    type = "required"
    versionRange = "[0.2.0,)"
    ordering = "AFTER"
    side = "CLIENT"
